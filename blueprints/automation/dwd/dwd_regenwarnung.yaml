blueprint:
  name: DWD Regenwarnung
  description: >-
    Meldet Niederschlag inklusive Art nur einmal pro Niederschlagsereignis.
    Nutzt den Sensor „Regenwarnung“ der DWD-Precipitation-Integration.
    Die Vorwarnzeit stellst man am Regler „Vorwarnzeit Regenwarnung“ derselben Integration ein.
    In den Aktionen steht der fertige Meldungstext als {{ message_text }} zur Verfügung,
    die Texte selbst lassen sich unter „Meldungstexte“ anpassen.
  domain: automation
  input:
    warning_sensor:
      name: Regenwarnung-Sensor
      description: Sensor „Regenwarnung“ der DWD-Precipitation-Integration.
      selector:
        entity:
          filter:
            - integration: dwd_precipitation
              domain: sensor
    rain_sensor:
      name: Regensensor (optional)
      description: >-
        Meldet das Radar „Es regnet bereits“, der Regensensor ist aber trocken,
        kommt stattdessen der Text „Regensensor noch trocken“ (siehe Meldungstexte).
      default: ""
      selector:
        entity:
          filter:
            - domain: [binary_sensor, sensor]
    dry_minutes:
      name: Trockenzeit bis zum Ende eines Ereignisses (Minuten)
      description: Erst wenn es so lange trocken bleibt, kann eine neue Meldung kommen.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: min

    push_section:
      name: Benachrichtigung
      icon: mdi:cellphone-message
      input:
        push_actions:
          name: Aktionen
          description: >-
            Aktionen für die Push-Meldung. Vorbelegt ist eine Benachrichtigung in
            Home Assistant; ersetze sie z. B. durch notify.pushover oder
            notify.mobile_app_… und lass message: "{{ message_text }}" stehen.
          default:
            - action: notify.persistent_notification
              data:
                title: DWD Regenwarnung
                message: "{{ message_text }}"
          selector:
            action: {}
        push_after:
          name: Benachrichtigungen ab
          description: Gleiche Zeit bei „ab“ und „bis“ bedeutet rund um die Uhr.
          default: "00:00:00"
          selector:
            time: {}
        push_before:
          name: Benachrichtigungen bis
          default: "00:00:00"
          selector:
            time: {}

    announce_section:
      name: Durchsage
      icon: mdi:bullhorn-outline
      input:
        announce_actions:
          name: Aktionen
          description: >-
            Aktionen für Sprachdurchsagen. Vorbelegt ist notify.send_message mit
            message: "{{ message_text }}", aber deaktiviert: Ziel (z. B. deine
            Echo-Geräte) eintragen und die Aktion aktivieren.
          default:
            - action: notify.send_message
              enabled: false
              target:
                entity_id: notify.DEIN_LAUTSPRECHER
              data:
                message: "{{ message_text }}"
          selector:
            action: {}
        announce_after:
          name: Durchsagen ab
          description: Gleiche Zeit bei „ab“ und „bis“ bedeutet rund um die Uhr.
          default: "06:30:00"
          selector:
            time: {}
        announce_before:
          name: Durchsagen bis
          default: "21:30:00"
          selector:
            time: {}

    text_section:
      name: Meldungstexte
      icon: mdi:text-box-edit-outline
      collapsed: true
      description: >-
        Jeder Text ist eine Vorlage. Verfügbar sind:
        {{ wann }} („In 20 Minuten“ / „In wenigen Minuten“),
        {{ starts_in }} (Minuten bis Beginn),
        {{ next_length }} (Dauer in Minuten),
        {{ phrase }} („leichter Regen“, „mäßiger Schneefall“, „Hagel“),
        {{ wort }} („Regen“, „Schneefall“ …),
        {{ stufe }} („leicht“, „mäßig“, „stark“, „sehr stark“),
        {{ laeuft }} („Es regnet bereits“, „Es schneit bereits“ …),
        {{ beginnt }} („zu regnen“, „zu schneien“ … oder die Phrase),
        {{ current_remaining }} (Minuten bis Ende, wenn es schon regnet),
        {{ horizon }} (Vorhersagehorizont in Minuten),
        {{ art }} (Rohwert wie rain, snow, hail),
        {{ peak }} (Spitzenintensität in mm/h),
        {{ amount }} (Menge in mm).
      input:
        text_soon:
          name: Niederschlag kommt
          default: "{{ wann }} beginnt {{ phrase }} für {{ next_length }} Minuten."
          selector:
            text:
              multiline: true
        text_soon_open:
          name: Niederschlag kommt, Ende offen
          default: "{{ wann }} beginnt {{ phrase }}, voraussichtlich mindestens {{ next_length }} Minuten."
          selector:
            text:
              multiline: true
        text_rain:
          name: Niederschlag läuft
          default: "{{ laeuft }}, noch etwa {{ current_remaining }} Minuten."
          selector:
            text:
              multiline: true
        text_rain_open:
          name: Niederschlag läuft, Ende offen
          default: "{{ laeuft }}, voraussichtlich mindestens {{ horizon }} Minuten."
          selector:
            text:
              multiline: true
        text_sensor_dry:
          name: Radar meldet Niederschlag, Regensensor noch trocken
          default: "Es kann gleich {{ beginnt }} beginnen."
          selector:
            text:
              multiline: true
        text_freezing:
          name: Zusatz bei gefrierendem Regen
          description: Wird bei gefrierendem Regen oder Nieselregen angehängt. Leer lassen, um ihn wegzulassen.
          default: "Achtung, Glättegefahr!"
          selector:
            text: {}

variables:
  warning_sensor: !input warning_sensor
  rain_sensor: !input rain_sensor

triggers:
  - trigger: state
    entity_id: !input warning_sensor
    to:
      - soon
      - rain
conditions:
  - condition: template
    value_template: "{{ states(warning_sensor) in ['soon', 'rain'] }}"
actions:
  # Bausteine für die Meldungstexte. Die Reihenfolge zählt: spätere Variablen
  # (auch die Texte aus den Eingaben) können frühere verwenden.
  - variables:
      sensor_state: "{{ states(warning_sensor) }}"
      starts_in: "{{ state_attr(warning_sensor, 'rain_starts_in_min') | int(0) }}"
      next_length: "{{ state_attr(warning_sensor, 'next_length') | int(0) }}"
      next_open_end: "{{ state_attr(warning_sensor, 'next_open_end') | bool(false) }}"
      current_open_end: "{{ state_attr(warning_sensor, 'current_open_end') | bool(false) }}"
      current_remaining: "{{ state_attr(warning_sensor, 'current_remaining_min') | int(0) }}"
      horizon: "{{ state_attr(warning_sensor, 'forecast_remaining_horizon_min') | int(60) }}"
      peak: "{{ state_attr(warning_sensor, 'next_peak_intensity') | float(0) }}"
      amount: "{{ state_attr(warning_sensor, 'next_amount_mm') | float(0) }}"
      art: "{{ state_attr(warning_sensor, 'precipitation_type') | default('', true) }}"
      stufe: "{{ state_attr(warning_sensor, 'next_intensity_level') | default('leicht', true) }}"
      wort: >-
        {{ {'rain': 'Regen', 'drizzle': 'Nieselregen', 'freezing_drizzle': 'gefrierender Nieselregen',
            'freezing_rain': 'gefrierender Regen', 'sleet': 'Schneeregen', 'snow': 'Schneefall',
            'graupel': 'Graupel', 'hail': 'Hagel', 'large_hail': 'Hagel mit großen Körnern',
            'thunderstorm': 'Gewitterregen'}.get(art, 'Niederschlag') }}
      # Hagel ohne Stärkeangabe, sonst z. B. "mäßiger Schneefall" (alle Nomen sind maskulin)
      phrase: "{{ wort if art in ['hail', 'large_hail'] else stufe ~ 'er ' ~ wort }}"
      wann: "{{ 'In wenigen Minuten' if starts_in <= 2 else 'In ' ~ starts_in ~ ' Minuten' }}"
      laeuft: >-
        {{ {'rain': 'Es regnet bereits', 'drizzle': 'Es nieselt bereits',
            'freezing_drizzle': 'Es fällt bereits gefrierender Nieselregen',
            'freezing_rain': 'Es fällt bereits gefrierender Regen', 'sleet': 'Es fällt bereits Schneeregen',
            'snow': 'Es schneit bereits', 'graupel': 'Es graupelt bereits', 'hail': 'Es hagelt bereits',
            'large_hail': 'Es hagelt bereits mit großen Körnern',
            'thunderstorm': 'Es gewittert bereits'}.get(art, 'Es fällt bereits Niederschlag') }}
      beginnt: >-
        {{ {'rain': 'zu regnen', 'drizzle': 'zu nieseln', 'snow': 'zu schneien', 'graupel': 'zu graupeln',
            'hail': 'zu hageln', 'large_hail': 'zu hageln', 'thunderstorm': 'zu gewittern'}.get(art, phrase) }}
      # Regensensor vor Ort (optional): trocken = "off"/"dry". Ohne Sensor oder
      # wenn er nicht erreichbar ist, bleibt es bei "Niederschlag läuft".
      regensensor_trocken: >-
        {{ rain_sensor not in [none, ''] and states(rain_sensor) in ['off', 'dry'] }}
      t_soon: !input text_soon
      t_soon_open: !input text_soon_open
      t_rain: !input text_rain
      t_rain_open: !input text_rain_open
      t_sensor_dry: !input text_sensor_dry
      t_freezing: !input text_freezing
  - variables:
      message_text: >-
        {%- if sensor_state == 'rain' and regensensor_trocken -%}{{ t_sensor_dry }}
        {%- elif sensor_state == 'rain' -%}{{ t_rain_open if current_open_end else t_rain }}
        {%- elif next_open_end -%}{{ t_soon_open }}
        {%- elif next_length > 0 -%}{{ t_soon }}
        {%- else -%}{{ wann }} ist {{ wort }} möglich.
        {%- endif -%}
        {%- if art in ['freezing_drizzle', 'freezing_rain'] and t_freezing %} {{ t_freezing }}{%- endif -%}
  # Benachrichtigungen und Durchsagen nur im jeweiligen Zeitfenster. Als "if"
  # statt als Bedingung, damit das Warten auf "trocken" auch nachts läuft und
  # nicht mehrfach meldet.
  - if:
      - condition: time
        after: !input push_after
        before: !input push_before
    then:
      - choose: []
        default: !input push_actions
  - if:
      - condition: time
        after: !input announce_after
        before: !input announce_before
    then:
      - choose: []
        default: !input announce_actions
  # Ereignis gilt erst als beendet, wenn es die eingestellte Zeit trocken bleibt.
  # So erzeugt eine kurze Lücke im Radarbild keine zweite Meldung.
  - wait_for_trigger:
      - trigger: state
        entity_id: !input warning_sensor
        to: dry
        for:
          minutes: !input dry_minutes
mode: single
max_exceeded: silent
