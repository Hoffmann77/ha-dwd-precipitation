[project]
name = "ha-dwd-precipitation"
version = "2026.10.1rc1"
requires-python = ">=3.14.2,<3.15"

[tool.uv]
package = false  # not a distributable Python package; test in-place via pythonpath

# Component only runs under HA (Linux/macOS/Windows x86_64); excluding the
# niche Windows ARM64 slice avoids uv resolving unsatisfiable transitive
# constraints (e.g. numpy) for a platform nobody targets.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32' and platform_machine != 'ARM64'",
]

conflicts = [
    [
        { group = "unit-test" },
        { group = "ha-test" },
        { group = "wradlib-comparison" },
    ],
]

[dependency-groups]
# Minimal deps for parser + live tests — no HA, no wradlib.
# numpy/aiohttp are pulled so radar/* and utils.py import without HA installed.
unit-test = [
    "pytest",
    # HA's own pin, so the parser tier decodes with the numpy users run.
    # Renovate leaves it alone; tests/integration/test_dependencies.py fails
    # when a HA bump moves numpy, which is the cue to update it here.
    "numpy==2.3.2",
    "aiohttp",
    "requests==2.34.2",
    "h5py==3.16.0",
]

# Installs only HA-compatible packages — validates the component runs in the
# same environment HA uses (same Python version, same numpy/h5py pins).
ha-test = [
    "pytest-homeassistant-custom-component==0.13.373",
    "h5py==3.16.0",
]

# Installs wradlib (+ pyproj, scipy, etc.) for parser comparison tests.
# Kept separate because wradlib's heavy deps are not part of the HA ecosystem.
wradlib-comparison = [
    "pytest",
    "wradlib==2.9.6",
    "requests==2.34.2",
    "h5py==3.16.0",
]

# Lint only: ruff, nothing imported. Not in the conflicts list above, so it
# can be synced on its own (`uv run --only-group lint ruff check`).
lint = [
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Pyflakes only for now: undefined and unused names. Broader rule sets later.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." allows `from custom_components... import` (used in ha-test job, where HA is installed).
# "custom_components/dwd_precipitation" allows `from radar.odim import` without triggering
# the HA-importing custom_components/dwd_precipitation/__init__.py (used in wradlib job).
pythonpath = [".", "custom_components/dwd_precipitation"]
# Network tests only when asked for (`-m live`, as the scheduled workflows
# do); a mistyped marker is an error, not a silent no-op.
addopts = "-m 'not live' --strict-markers"
asyncio_mode = "auto"
# asyncio_mode is pytest-asyncio's, which only the ha-test group installs.
filterwarnings = [
    "ignore:Unknown config option. asyncio_mode:pytest.PytestConfigWarning",
]
markers = [
    "live: requires network access to DWD OpenData (scheduled, not on PRs)",
    "wradlib: requires wradlib installed",
    "asyncio: async test (pytest-asyncio; redundant under asyncio_mode=auto)",
]
