name: HA version compatibility

# Version-drift monitor: runs the integration tier against the latest and dev
# Home Assistant, each with the pytest-home-assistant built from that same
# release (the plugin only works with the HA it was released with). The
# versions pyproject pins are what tests.yml runs on every PR and push to main.
# Scheduled (never gates PRs); opens/updates a tracking issue on failure.
on:
  schedule:
    - cron: "0 5 * * 1"   # weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ha-compat:
    name: Integration @ ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest
            ha_dev: false
            experimental: false
          - name: dev
            ha_dev: true
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install HA test dependencies
        run: uv sync --locked --only-group ha-test
      - name: Upgrade Home Assistant and its test plugin
        run: |
          if [ "${{ matrix.ha_dev }}" = "true" ]; then
            # Both from the same dev checkout, so they cannot drift apart.
            uv pip install -U \
              "homeassistant @ git+https://github.com/home-assistant/core@dev" \
              "pytest-home-assistant @ git+https://github.com/home-assistant/core@dev#subdirectory=packages/pytest-home-assistant"
          else
            uv pip install -U homeassistant pytest-home-assistant
          fi
      - name: Run integration tests
        # --no-sync so the manual version override above is not reverted by uv run.
        run: uv run --no-sync pytest tests/integration -v

      - name: Open / update tracking issue on failure
        if: ${{ failure() && !matrix.experimental }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="HA compatibility check failing (${{ matrix.name }})"
          BODY="The integration tier failed against the ${{ matrix.name }} Home Assistant release. A newer HA release may have broken the integration. Run: $RUN_URL"
          num=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
