name: Docs deploy

# Publishes the documentation site to GitHub Pages
# (https://hoffmann77.github.io/ha-dwd-precipitation/). The site describes
# the latest release, so it deploys when a release is published; run it by
# hand to republish a docs-only fix (pick the release tag, or main).
#
# Needs Settings -> Pages -> Source: "GitHub Actions".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (en + de)
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
