name: DWD release-delay drift check

# Averages how long after each product's nominal time its file actually appeared
# on DWD OpenData (from each recent file's Last-Modified header) and compares
# that against the integration's configured RELEASE_DELAY constants. Scheduled
# (never gates PRs); opens/updates a tracking issue once the observed delay
# drifts too far from what the integration assumes on two consecutive runs, so
# a single noisy measurement doesn't page anyone. The averaging reads a rolling
# window of already-published files, so the schedule time does not matter.
on:
  schedule:
    - cron: "0 6 * * *"    # daily 06:00 UTC
    - cron: "0 18 * * *"   # daily 18:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  release-delay:
    name: Check observed vs configured release delay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install unit-test dependencies
        run: uv sync --only-group unit-test

      - name: Restore consecutive-drift streak
        uses: actions/cache/restore@v4
        with:
          path: .release-delay-streak
          key: release-delay-streak-${{ github.run_id }}
          restore-keys: |
            release-delay-streak-

      - name: Check release delay against DWD OpenData
        id: check
        continue-on-error: true
        run: uv run python scripts/check_release_delay.py

      - name: Update consecutive-drift streak
        id: streak
        run: |
          prev=0
          [ -f .release-delay-streak ] && prev=$(cat .release-delay-streak)
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            count=0
          else
            count=$((prev + 1))
          fi
          echo "$count" > .release-delay-streak
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 2 ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save consecutive-drift streak
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .release-delay-streak
          key: release-delay-streak-${{ github.run_id }}

      - name: Open / update tracking issue on two consecutive drifts
        if: steps.streak.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="DWD release-delay drift detected"
          BODY="The scheduled release-delay check reported a product whose observed availability delay drifts too far from the configured RELEASE_DELAY (or a product could not be measured), on ${{ steps.streak.outputs.count }} consecutive runs. Review the run and, if DWD's publication lag has changed, update the product's RELEASE_DELAY. Run: $RUN_URL"
          num=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail job once drift is confirmed
        if: steps.streak.outputs.notify == 'true'
        run: exit 1
